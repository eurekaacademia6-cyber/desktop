name: Build Quotex Vision AI Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows Setup EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify project files
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "config.json",
            "vision/models.py",
            "vision/detector.py",
            "analysis/engine.py",
            "ui/main_window.py",
            "ui/overlay.py",
            "installer/QuotexVisionAI.spec",
            "installer/QuotexVisionAI.iss"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Missing required file: $file"
            }
          }

          Write-Host "All required files are present."

      - name: Validate Python
        shell: pwsh
        run: |
          python -m compileall .
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python syntax validation failed."
          }

      - name: Validate imports
        shell: pwsh
        run: |
          python -c "from vision.detector import CandleDetector; from analysis.engine import AnalysisEngine; from ui.overlay import Overlay; print('Critical imports OK')"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Critical module import failed."
          }

      - name: Clean PyInstaller output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force installer/dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path installer/dist | Out-Null

      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller installer/QuotexVisionAI.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller build failed."
          }

      - name: Verify application EXE
        shell: pwsh
        run: |
          $exe = "dist/QuotexVisionAI/QuotexVisionAI.exe"

          if (!(Test-Path $exe)) {
            Write-Error "Expected EXE not found: $exe"
          }

          Write-Host "Application EXE created:"
          Get-Item $exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup installation failed."
          }

      - name: Build normal Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found."
          }

          & $iscc "installer/QuotexVisionAI.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup build failed."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "installer/dist/QuotexVisionAI-Setup.exe"

          if (!(Test-Path $setup)) {
            Write-Error "Installer was not created: $setup"
          }

          Write-Host "Installer created successfully:"
          Get-Item $setup

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: QuotexVisionAI-Windows-Installer
          path: installer/dist/QuotexVisionAI-Setup.exe
          if-no-files-found: error

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: QuotexVisionAI-Portable
          path: dist/QuotexVisionAI/**
          if-no-files-found: error
